name: CI

# Pull requests only: main is checked before it merges, not again after.
# cache-warm.yml keeps the shared caches on main fresh so PRs start warm.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # No debug info: smaller caches and faster compiles and links.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    # A manual run checks everything.
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      front: ${{ github.event_name != 'pull_request' || steps.filter.outputs.front == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/**
            rust:
              - *ci
              - src-tauri/**
            front:
              - *ci
              - front-end/**

  front-end:
    name: Front-end type check
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-test
      # Lavapipe gives wgpu a software Vulkan adapter, so the GPU compositor
      # tests can run without a real GPU. The .debs come from the Actions
      # cache, not the Ubuntu mirror. FFmpeg is the shared media backend.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers libvulkan1
          version: 1
      # A static FFmpeg build: apt's ffmpeg breaks when restored from the
      # apt cache (its BLAS library is wired up by an install-time script).
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: cargo test
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"
      - name: GPU compositor, media parity and export tests (software adapter)
        run: cargo test --lib gpu -- --include-ignored
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"

  # Local Parakeet transcription is opt-in; make sure it keeps compiling.
  parakeet:
    name: Parakeet transcription check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-parakeet
      - run: cargo check --features parakeet

  rust-tests-windows:
    name: Rust tests (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-test
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: cargo test
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"

  # The Swift bridges for Mac preview/playback/export only build on macOS, so
  # this is the one place they are compiled and the Mac-only tests run.
  macos:
    name: macOS build and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.front == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Build front-end
        working-directory: front-end
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run tests
        working-directory: src-tauri
        run: cargo test
      - name: Check the app with the Tauri feature
        working-directory: src-tauri
        run: cargo check --features tauri-app

  tauri-app:
    name: Tauri app build check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.front == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
          version: 1
      # tauri::generate_context! needs front-end/dist to exist at compile time.
      - name: Build front-end
        working-directory: front-end
        run: npm ci --no-audit --no-fund && npm run build
      - name: Check the app with the Tauri feature
        working-directory: src-tauri
        run: cargo check --features tauri-app
