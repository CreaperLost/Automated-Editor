name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  front-end:
    name: Front-end type check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Lavapipe gives wgpu a software Vulkan adapter, so the GPU compositor
      # tests can run without a real GPU.
      # Lavapipe for the GPU tests, FFmpeg for the shared media backend.
      - name: Install software Vulkan driver and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 ffmpeg
      - run: cargo test
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"
      - name: GPU compositor, media parity and export tests (software adapter)
        run: cargo test --lib gpu -- --include-ignored
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"

  rust-tests-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: cargo test
        env:
          AEROEDITS_REQUIRE_FFMPEG: "1"

  tauri-app:
    name: Tauri app build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      # tauri::generate_context! needs front-end/dist to exist at compile time.
      - name: Build front-end
        working-directory: front-end
        run: npm ci && npm run build
      - name: Check the app with the Tauri feature
        working-directory: src-tauri
        run: cargo check --features tauri-app
