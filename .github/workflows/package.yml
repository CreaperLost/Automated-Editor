name: Package

# Builds the installable app: a Windows NSIS installer and an unsigned macOS
# .dmg. Release builds are slow, so this runs only when bundling inputs change
# in a pull request, or on demand from the Actions tab ("Run workflow").
# The installers are attached to each run as downloadable artifacts.
on:
  pull_request:
    paths:
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/build.rs
      - src-tauri/icons/**
      - src-tauri/capabilities/**
      - .github/workflows/package.yml
  workflow_dispatch:

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            output: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            output: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: package-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      # tauri build runs beforeBuildCommand (npm run build), which needs the deps.
      - name: Install front-end dependencies
        working-directory: front-end
        run: npm ci --no-audit --no-fund
      - name: Build installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --ci --features tauri-app --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: AeroEdits-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
