<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-labelledby="title desc">
<title id="title">How the user's agent works with AeroEdits today</title>
<desc id="desc">The user talks to their own agent, which reads the aeroedits skill and calls the app through a private MCP bridge. Inside the app, deterministic passes and in-app models do the work, and the Agent panel shows proposals and history back to the user.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .frame { fill: none; stroke: #888780; stroke-width: 0.8; stroke-dasharray: 4 4; }
  .label { fill: #2c2c2a; }
  .gray rect { fill: #f1efe8; stroke: #888780; stroke-width: 0.8; } .gray .th { fill: #2c2c2a; } .gray .ts { fill: #5f5e5a; }
  .purple rect { fill: #eeedfe; stroke: #534ab7; stroke-width: 0.8; } .purple .th { fill: #3c3489; } .purple .ts { fill: #534ab7; }
  .teal rect { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 0.8; } .teal .th { fill: #085041; } .teal .ts { fill: #0f6e56; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1f1f1e; }
    .arr { stroke: #888780; } .frame { stroke: #b4b2a9; } .label { fill: #f1efe8; }
    .gray rect { fill: #444441; stroke: #b4b2a9; } .gray .th { fill: #f1efe8; } .gray .ts { fill: #d3d1c7; }
    .purple rect { fill: #3c3489; stroke: #afa9ec; } .purple .th { fill: #eeedfe; } .purple .ts { fill: #cecbf6; }
    .teal rect { fill: #085041; stroke: #5dcaa5; } .teal .th { fill: #e1f5ee; } .teal .ts { fill: #9fe1cb; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="450" rx="12"/>

<g class="purple"><rect x="40" y="40" width="160" height="56" rx="8"/>
  <text class="th" x="120" y="62" text-anchor="middle">User</text>
  <text class="ts" x="120" y="82" text-anchor="middle">answers, approves</text></g>
<g class="gray"><rect x="260" y="40" width="160" height="56" rx="8"/>
  <text class="th" x="340" y="62" text-anchor="middle">Your agent</text>
  <text class="ts" x="340" y="82" text-anchor="middle">Claude Code, Codex</text></g>
<g class="gray"><rect x="480" y="40" width="160" height="56" rx="8"/>
  <text class="th" x="560" y="62" text-anchor="middle">aeroedits skill</text>
  <text class="ts" x="560" y="82" text-anchor="middle">rules + templates</text></g>
<line class="arr" x1="202" y1="68" x2="256" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="478" y1="68" x2="424" y2="68" marker-end="url(#arrow)"/>

<g class="gray"><rect x="230" y="140" width="220" height="56" rx="8"/>
  <text class="th" x="340" y="162" text-anchor="middle">MCP bridge</text>
  <text class="ts" x="340" y="182" text-anchor="middle">private pipe, same account</text></g>
<line class="arr" x1="340" y1="98" x2="340" y2="136" marker-end="url(#arrow)"/>

<rect class="frame" x="40" y="232" width="600" height="198" rx="16"/>
<text class="th label" x="60" y="257">AeroEdits app</text>
<line class="arr" x1="340" y1="198" x2="340" y2="230" marker-end="url(#arrow)"/>

<g class="teal"><rect x="60" y="272" width="176" height="138" rx="12"/>
  <text class="th" x="148" y="302" text-anchor="middle">Passes and checks</text>
  <text class="ts" x="148" y="330" text-anchor="middle">silence, zooms, layouts</text>
  <text class="ts" x="148" y="350" text-anchor="middle">check, storyboard</text>
  <text class="ts" x="148" y="370" text-anchor="middle">render, export</text>
  <text class="ts" x="148" y="394" text-anchor="middle">no model</text></g>
<g class="teal"><rect x="252" y="272" width="176" height="138" rx="12"/>
  <text class="th" x="340" y="302" text-anchor="middle">In-app models</text>
  <text class="ts" x="340" y="330" text-anchor="middle">transcribe, align</text>
  <text class="ts" x="340" y="350" text-anchor="middle">filler review</text>
  <text class="ts" x="340" y="370" text-anchor="middle">chapters, short picks</text>
  <text class="ts" x="340" y="394" text-anchor="middle">local or user's keys</text></g>
<g class="purple"><rect x="444" y="272" width="176" height="138" rx="12"/>
  <text class="th" x="532" y="302" text-anchor="middle">Agent panel</text>
  <text class="ts" x="532" y="330" text-anchor="middle">proposal batches</text>
  <text class="ts" x="532" y="350" text-anchor="middle">history with undo</text>
  <text class="ts" x="532" y="370" text-anchor="middle">running calls</text>
  <text class="ts" x="532" y="394" text-anchor="middle">not a chat</text></g>
</svg>
