<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f3d4a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9fbf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#032a2a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="upper"><polygon points="0,0 1024,0 1024,300 0,760"/></clipPath>
    <clipPath id="lower"><polygon points="0,792 1024,332 1024,1024 0,1024"/></clipPath>
  </defs>
  <!-- Tile: a rounded square in the app's teal gradient -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#shine)"/>
  <!-- Play triangle, cut through on a diagonal; the lower half slides along the cut -->
  <g filter="url(#shadow)">
    <path clip-path="url(#upper)" d="M352 262 C352 226 390 204 421 222 L770 474 C800 492 800 532 770 550 L421 802 C390 820 352 798 352 762 Z" fill="url(#play)"/>
    <path clip-path="url(#lower)" transform="translate(22 -10)" d="M352 262 C352 226 390 204 421 222 L770 474 C800 492 800 532 770 550 L421 802 C390 820 352 798 352 762 Z" fill="url(#play)"/>
  </g>
  <!-- Spark: the automatic part -->
  <path d="M760 214 L778 262 L826 280 L778 298 L760 346 L742 298 L694 280 L742 262 Z" fill="#fef9c3"/>
</svg>
