<!doctype html>
<!--
  Steps, linked: an AeroEdits graphic (a HyperFrames composition), built like `blank` (see
  its notes): the look's tokens, the style's colours, a portrait block, cut unless eased.
  A demonstration: up to five steps of a process appear one by one, each joined to the last
  by a line drawn as it is reached, the current one ringed. For "first this, then that, which
  gives this": how a flow goes, shown. `cue` is the second (into the graphic) the first step
  shows; the rest follow evenly, the last by about three quarters of its length. Left to
  right in 16:9, top to bottom in portrait.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label","default":"How it works"},
    {"id":"title","type":"string","label":"Title","default":"From recording to upload"},
    {"id":"steps","type":"string","label":"Steps (one per line, up to 5)","default":"Record the screen\nEdit with an agent\nCheck the frames\nExport and upload"},
    {"id":"cue","type":"number","label":"First step at (s)","default":0.8,"min":0,"max":60},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Steps, linked</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .flow {
        flex: none;
        display: flex;
        align-items: center;
        width: 84vw;
      }
      .step {
        flex: none;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--look-gap) * 0.6);
        padding: calc(var(--look-pad) * 0.9);
        text-align: center;
      }
      .ring {
        position: absolute;
        inset: calc(var(--look-border) * -1);
        border: 0.45vmin solid var(--accent, #0071E3);
        border-radius: var(--look-radius);
        pointer-events: none;
      }
      .num {
        flex: none;
        display: grid;
        place-items: center;
        width: 5.6vmin;
        height: 5.6vmin;
        border-radius: 50%;
        background: var(--look-tint);
        color: var(--accent, #0071E3);
        font-size: var(--look-label);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .say {
        flex: none;
        width: 100%;
        font-size: calc(var(--look-body) * 1.05);
        font-weight: 600;
        line-height: 1.3;
        max-height: calc(var(--look-body) * 1.05 * 1.3 * 3);
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .link {
        flex: none;
        position: relative;
        width: 5vw;
        height: 0.6vmin;
      }
      .line {
        position: absolute;
        inset: 0 1vmin 0 0;
        border-radius: 99vmin;
        background: var(--accent, #0071E3);
        transform-origin: 0 50%;
      }
      .head {
        position: absolute;
        right: 0.4vmin;
        top: 50%;
        width: 1.5vmin;
        height: 1.5vmin;
        margin-top: -0.75vmin;
        box-sizing: border-box;
        border-top: 0.6vmin solid var(--accent, #0071E3);
        border-right: 0.6vmin solid var(--accent, #0071E3);
        transform: rotate(45deg);
      }
      @media (orientation: portrait) {
        .layout {
          padding-bottom: 10vh;
        }
        .title {
          font-size: var(--look-title);
          max-height: calc(var(--look-title) * var(--look-leading) * 2);
        }
        .flow {
          flex-direction: column;
          width: 76vw;
        }
        .step {
          width: 100%;
          box-sizing: border-box;
          flex-direction: row;
          text-align: left;
          gap: var(--look-gap);
        }
        .say {
          width: auto;
          flex: 1;
          min-width: 0;
          font-size: calc(var(--look-body) * 1.3);
          max-height: calc(var(--look-body) * 1.3 * 1.3 * 2);
        }
        .link {
          width: 0.6vmin;
          height: 3.4vh;
        }
        .line {
          inset: 0 0 1vmin 0;
          transform-origin: 50% 0;
        }
        .head {
          right: auto;
          left: 50%;
          top: auto;
          bottom: 0.4vmin;
          margin: 0 0 0 -0.75vmin;
          transform: rotate(135deg);
        }
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <span class="pill" id="label" data-var-text="label">How it works</span>
        <h1 class="title" id="title" data-var-text="title">From recording to upload</h1>
        <div class="flow" id="flow"></div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 6;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits: while more
      // than half a line spills (a line too many), and by width too (`wide`) where the box's
      // width doesn't follow its text. What spills after that is the letters themselves (a
      // font whose glyphs reach past tight lines, at any size): the box grows to hold them,
      // as shrinking would never stop.
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }

      const portrait = matchMedia("(orientation: portrait)").matches;
      const steps = String(vars.steps ?? "Record the screen\nEdit with an agent\nCheck the frames\nExport and upload")
        .split(/\r?\n|\|/)
        .map((s) => s.trim())
        .filter(Boolean)
        .slice(0, 5);
      const flow = document.getElementById("flow");
      const stepEls = [], rings = [], links = [];
      steps.forEach((text, i) => {
        if (i > 0) {
          const link = document.createElement("div");
          link.className = "link";
          const line = document.createElement("i");
          line.className = "line";
          const head = document.createElement("i");
          head.className = "head";
          link.append(line, head);
          flow.appendChild(link);
          links.push({ line, head });
        }
        const step = document.createElement("div");
        step.className = "step card";
        // Widths from the viewport, not measured: the flow's share less the links'.
        if (!portrait) step.style.width = `${(84 - (steps.length - 1) * 5) / steps.length}vw`;
        const n = document.createElement("span");
        n.className = "num";
        n.textContent = String(i + 1);
        const say = document.createElement("span");
        say.className = "say";
        say.textContent = text;
        const ring = document.createElement("i");
        ring.className = "ring";
        step.append(n, say, ring);
        flow.appendChild(step);
        stepEls.push({ step, say });
        rings.push(ring);
      });
      if (!steps.length) flow.style.display = "none";
      ["title", "label"].forEach((id) => fit(document.getElementById(id)));
      stepEls.forEach(({ say }) => fit(say));
      // The flow as a whole fits its share of the frame (a short's part is shorter than a
      // phone): the steps' text shrinks together until it does.
      {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        const room = innerHeight * (portrait ? 0.55 : 0.5);
        for (let n = 0; n < 30 && flow.offsetHeight > room; n++) {
          stepEls.forEach(({ say }) => {
            say.style.fontSize = `${(parseFloat(getComputedStyle(say).fontSize) * 0.93) / unit}vmin`;
          });
        }
      }

      // The first step on `cue`, the last by about three quarters in, so a short placement
      // still shows them all.
      const cue = Math.min(Math.max(num("cue", 0.8), 0.3), Math.max(0.3, length * 0.4));
      const last = Math.max(cue, length * 0.72 - 0.4);
      const every = steps.length > 1 ? (last - cue) / (steps.length - 1) : 0;
      const draw = Math.min(0.45, every * 0.6);
      const show = Math.min(seconds, 0.6);
      const tl = gsap.timeline({ paused: true });
      tl.from(["#label", "#title"], { y: rise, opacity: 0, stagger: stagger }, 0.1);
      tl.set(rings, { opacity: 0 }, 0);
      stepEls.forEach(({ step }, i) => {
        const at = cue + every * i;
        if (i > 0) {
          const { line, head } = links[i - 1];
          const axis = portrait ? "scaleY" : "scaleX";
          tl.fromTo(line, { [axis]: 0 }, { [axis]: 1, duration: draw, ease: "power2.inOut" }, at - draw);
          tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, at - 0.15);
          tl.to(rings[i - 1], { opacity: 0, duration: 0.25, ease: "power1.out" }, at);
        }
        tl.from(step, { y: rise, opacity: 0, duration: show }, at);
        tl.to(rings[i], { opacity: 1, duration: 0.25, ease: "power1.out" }, at);
      });
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
