<!doctype html>
<!--
  Device: an AeroEdits graphic (a HyperFrames composition) drawn with three.js. A picture (a
  frame of the recording, a screenshot: `library` `kind: image` `use` sets `picture`) on the
  screen of a 3D laptop, or a phone when the picture is portrait. The device turns in from an
  angle and settles facing the viewer by `cue`, at an even speed, then holds; the kicker, title
  and caption sit flat in HTML beside it (above it at 9:16). For "this is the app", a result on
  screen, the page a step ends on. With no picture the screen shows the look's tint.
  The scene is drawn on HyperFrames' hf-seek event from its time, so any seek draws the same
  frame; the words rise on a paused GSAP timeline.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id": "label", "type": "string", "label": "Kicker", "default": "The new dashboard"},
    {"id": "title", "type": "string", "label": "Title", "default": "Everything on one screen"},
    {"id": "caption", "type": "string", "label": "Caption", "default": ""},
    {"id": "picture", "type": "string", "label": "Picture (its file in the graphic)", "default": ""},
    {"id": "cue", "type": "number", "label": "Faces you at (s)", "default": 1.4, "min": 0.4, "max": 60},
    {"id": "background", "type": "color", "label": "Background", "default": "#FFFFFF"},
    {"id": "text", "type": "color", "label": "Text", "default": "#1D1D1F"},
    {"id": "accent", "type": "color", "label": "Accent", "default": "#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Device</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }

      .probes {
        display: none;
      }
      #c-accent {
        color: var(--accent, #0071e3);
      }
      #c-tint {
        color: var(--look-tint);
      }
      #c-line {
        color: var(--look-line);
      }
      #c-back {
        color: var(--background, #ffffff);
      }
      #c-text {
        color: var(--text, #1d1d1f);
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #scene {
        left: 38%;
        width: 62%;
      }
      .layout {
        z-index: 1;
        top: 0;
        bottom: auto;
        height: 100vh;
        right: 58%;
        padding: 0 0 0 var(--look-margin);
        align-items: flex-start;
        text-align: left;
      }
      .layout .title {
        font-size: calc(var(--look-title) * 0.8);
      }
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        display: none;
      }
      [data-mode="over"] #scene {
        left: 0;
        width: 100%;
        top: 45%;
        height: 55%;
      }
      @media (orientation: portrait) {
        #scene {
          left: 0;
          width: 100%;
          top: 34%;
          height: 66%;
        }
        .layout {
          right: 0;
          top: 4vh;
          bottom: auto;
          height: 34vh;
          padding: 0 calc(var(--look-margin) * 0.8);
          align-items: center;
          text-align: center;
        }
        .layout .title {
          font-size: calc(var(--look-title) * 1.1);
        }
        [data-mode="over"] #scene {
          top: 45%;
          height: 55%;
        }
      }
    </style>
    <script src="gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./three.module.js", "three/addons/": "./three-addons/" } }
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <canvas id="scene"></canvas>
      <div class="layout" id="layout">
        <span class="pill" id="label" data-var-text="label">The new dashboard</span>
        <h1 class="title" id="title" data-var-text="title">Everything on one screen</h1>
        <p class="muted" id="caption" data-var-text="caption"></p>
        <p class="muted" id="missing"></p>
      </div>
      <div class="probes" aria-hidden="true">
        <i id="c-accent"></i><i id="c-tint"></i><i id="c-line"></i><i id="c-back"></i><i id="c-text"></i>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 5;
      const vars = window.__hyperframes?.getVariables?.() || {};
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Long words shrink together until the column holds them (its height is set in vh, so
      // it can be measured before the root has one).
      const layout = document.getElementById("layout");
      for (let zoom = 1, n = 0; n < 20 && layout.scrollHeight > layout.clientHeight + 1; n++) {
        zoom *= 0.92;
        for (const child of layout.children) child.style.zoom = zoom;
      }
      const cue = Math.min(Math.max(num("cue", 1.4), 0.4), Math.max(0.4, length - 1));
      const tl = gsap.timeline({ paused: true });
      const rise = token("distance", "1.8vmin");
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      tl.from(["#label", "#title"], { y: rise, opacity: 0, stagger }, 0.2);
      tl.from("#caption", { y: rise, opacity: 0 }, cue);
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#scene", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#scene", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      window.THREE = THREE;
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 6;
      const vars = window.__hyperframes?.getVariables?.() || {};
      const cueValue = parseFloat(vars.cue);
      const cue = Math.min(Math.max(Number.isFinite(cueValue) ? cueValue : 1.4, 0.4), Math.max(0.4, length - 1));
      const file = String(vars.picture ?? "").trim();

      // Colours: each probe takes a look colour in CSS, and the scene reads it back computed.
      // A 1x1 canvas turns any CSS colour (color-mix gives color(srgb ...)) into plain RGB.
      const paint = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
      const colour = (id) => {
        paint.clearRect(0, 0, 1, 1);
        paint.fillStyle = getComputedStyle(document.getElementById(id)).color;
        paint.fillRect(0, 0, 1, 1);
        const [r, g, b] = paint.getImageData(0, 0, 1, 1).data;
        return new THREE.Color((r << 16) | (g << 8) | b);
      };
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      const scene = new THREE.Scene();
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      const key = new THREE.DirectionalLight(0xffffff, 1.4);
      key.position.set(3, 5, 6);
      scene.add(key);
      const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      // Even motion: one eased move between two poses, never a path through uneven keys.
      const smooth = (x) => { const t = Math.min(Math.max(x, 0), 1); return t * t * (3 - 2 * t); };
      const size = () => {
        const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
        if (canvas.width !== w || canvas.height !== h) renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      const body = new THREE.MeshStandardMaterial({ color: colour("c-text"), roughness: 0.45, metalness: 0.35 });
      const glass = new THREE.MeshBasicMaterial({ color: colour("c-tint") });
      const device = new THREE.Group();
      scene.add(device);
      let screenWidth = 3.2, screenHeight = 2.0;
      const ball = new THREE.Sphere();
      let room = 0.9;
      // Builds the device for the picture's shape: a laptop for a wide picture, a phone for a tall one.
      function build(aspect) {
        device.clear();
        const tall = aspect < 1;
        // A phone is all screen, so it gets a little more room round it.
        room = tall ? 1.05 : 0.9;
        screenHeight = tall ? 3.4 : 3.2 / Math.min(Math.max(aspect, 1), 2.4);
        screenWidth = screenHeight * aspect;
        const rim = tall ? 0.12 : 0.1;
        const lid = new THREE.Mesh(
          new RoundedBoxGeometry(screenWidth + rim * 2, screenHeight + rim * 2, 0.09, 4, tall ? 0.22 : 0.06),
          body,
        );
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(screenWidth, screenHeight), glass);
        screen.position.z = 0.046;
        const top = new THREE.Group();
        top.add(lid, screen);
        device.add(top);
        if (!tall) {
          // The laptop's base, hinged under the screen and tipped towards the viewer.
          const base = new THREE.Mesh(
            new RoundedBoxGeometry(screenWidth + rim * 2.6, 0.08, screenHeight * 0.72, 4, 0.04),
            body,
          );
          base.position.set(0, -screenHeight / 2 - rim, screenHeight * 0.36);
          device.add(base);
          top.rotation.x = -0.08;
        }
        // Measured facing the viewer, once, so the camera holds still while the device turns.
        device.rotation.set(0, 0, 0);
        new THREE.Box3().setFromObject(device).getBoundingSphere(ball);
      }
      build(16 / 10);
      // A file that isn't there (or isn't a picture) is named under the words, so a wrong path shows.
      const missing = () => {
        document.getElementById("missing").textContent = `No picture at ${file}`;
      };
      if (!file) {
        // No picture yet: the screen shows the look's tint.
      } else if (!/^[\w./-]+\.(png|jpe?g|webp)$/i.test(file) || file.includes("..")) {
        missing();
      } else {
        new THREE.ImageLoader().load(file, (image) => {
          // Laid on the look's background first, so a see-through picture doesn't show black.
          const sheet = document.createElement("canvas");
          sheet.width = image.naturalWidth || image.width;
          sheet.height = image.naturalHeight || image.height;
          const pen = sheet.getContext("2d");
          pen.fillStyle = getComputedStyle(document.getElementById("c-back")).color;
          pen.fillRect(0, 0, sheet.width, sheet.height);
          pen.drawImage(image, 0, 0);
          const texture = new THREE.CanvasTexture(sheet);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          glass.map = texture;
          glass.color.set(0xffffff);
          glass.needsUpdate = true;
          build(sheet.width / sheet.height);
          draw(Number(window.__hfThreeTime) || 0);
        }, undefined, missing);
      }
      function draw(time) {
        size();
        // Turns from an angle to facing the viewer by the cue, then holds still.
        const turn = 1 - smooth(time / cue);
        device.rotation.set(0.12 * turn, -0.75 * turn, 0);
        // The camera stands back far enough for the whole device, at any turn, at this frame's
        // shape: it frames the device's bounding sphere.
        const half = (camera.fov * Math.PI) / 360;
        const across = Math.atan(Math.tan(half) * camera.aspect);
        const distance = (ball.radius * room) / Math.sin(Math.min(half, across));
        camera.position.set(ball.center.x, ball.center.y + distance * 0.12, ball.center.z + distance);
        camera.lookAt(ball.center);
        renderer.render(scene, camera);
      }

      // HyperFrames seeks every frame: draw that moment, and nothing on a clock of its own.
      window.addEventListener("hf-seek", (event) => draw(Number(event.detail?.time) || 0));
      draw(Number(window.__hfThreeTime) || 0);
    </script>
  </body>
</html>
