<!doctype html>
<!--
  Picture: an AeroEdits graphic (a HyperFrames composition), built like count-up. One picture
  brought into the graphic (a screenshot, the user's own picture, a drawn illustration or a
  library one: `library` `kind: image` `use` or `draw` sets `picture`), as a paper prints a
  photograph: a kicker above, the picture as large as the frame allows, a rule and a caption
  under it saying what it shows, and a source tag. It lands and holds still; on `cue` the
  caption lands. With no picture yet it shows an empty picture box, which the visuals check
  blocks. For "this is what it looks like", the screen a story is about, an idea drawn.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id": "label", "type": "string", "label": "Kicker", "default": "The new settings page"},
    {"id": "picture", "type": "string", "label": "Picture (its file in the graphic)", "default": ""},
    {"id": "caption", "type": "string", "label": "Caption", "default": "Memory now has its own switch, off by default"},
    {"id": "source", "type": "string", "label": "Source tag", "default": ""},
    {"id": "cue", "type": "number", "label": "Caption at (s)", "default": 0.9, "min": 0, "max": 60},
    {"id": "background", "type": "color", "label": "Background", "default": "#FFFFFF"},
    {"id": "text", "type": "color", "label": "Text", "default": "#1D1D1F"},
    {"id": "accent", "type": "color", "label": "Accent", "default": "#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Picture</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: calc(var(--look-gap) * 0.8);
        padding: 6vh var(--look-margin) calc(6vh + var(--look-label) * 2.2);
        text-align: center;
      }
      .kicker {
        flex: none;
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
        color: var(--accent, #0071E3);
        max-width: 80vw;
        max-height: calc(var(--look-label) * 1.3 * 2);
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .kicker:empty {
        display: none;
      }
      /* The picture takes what the words leave, at its own shape. */
      #frame {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 150vmin;
      }
      #picture {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #empty {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: calc(var(--look-border) * 2) solid var(--look-muted);
        display: none;
      }
      #empty svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #empty line {
        stroke: var(--look-line);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      #empty span {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 0.4vmin 1.4vmin;
        background: var(--background, #ffffff);
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        color: var(--look-muted);
        max-width: 80%;
        overflow-wrap: anywhere;
      }
      [data-edged] #picture {
        box-sizing: border-box;
        border: var(--look-border) solid var(--look-muted);
      }
      [data-empty] #picture {
        display: none;
      }
      [data-empty] #empty {
        display: block;
      }
      .caption {
        flex: none;
        box-sizing: border-box;
        width: min(100%, 150vmin);
        margin: 0;
        padding-top: calc(var(--look-gap) * 0.6);
        border-top: var(--look-border) solid var(--look-line);
        font-size: var(--look-body);
        line-height: 1.3;
        max-height: calc(var(--look-body) * 1.3 * 2 + var(--look-gap) * 0.6);
        overflow-wrap: anywhere;
      }
      .caption:empty {
        display: none;
      }
      @media (orientation: portrait) {
        #layout {
          padding: 10vh calc(var(--look-margin) * 0.7) calc(14vh + var(--look-label) * 3.2);
          gap: calc(var(--look-gap) * 1.1);
        }
        .kicker {
          font-size: calc(var(--look-label) * 1.3);
          max-height: calc(var(--look-label) * 1.3 * 1.3 * 2);
        }
        #frame {
          max-width: none;
        }
        .caption {
          width: 100%;
          font-size: calc(var(--look-body) * 1.4);
          max-height: calc(var(--look-body) * 1.4 * 1.3 * 3 + var(--look-gap) * 0.6);
        }
        #empty span {
          font-size: calc(var(--look-label) * 1.3);
        }
      }
      /* The screen's part of a short's split: less room, no platform buttons below. */
      [data-mode="split"] #layout {
        padding: 5vh calc(var(--look-margin) * 0.7) calc(5vh + var(--look-label) * 2.6);
        gap: calc(var(--look-gap) * 0.8);
      }
      [data-mode="split"] .kicker {
        font-size: var(--look-label);
      }
      [data-mode="split"] .caption {
        font-size: var(--look-body);
        max-height: calc(var(--look-body) * 1.3 * 2 + var(--look-gap) * 0.6);
      }

      /* A source tag: where a claim, number or quote on screen comes from. */
      .tag {
        position: absolute;
        left: var(--look-margin);
        bottom: calc(var(--look-margin) * 0.55);
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        letter-spacing: 0.04em;
        color: var(--look-muted);
        line-height: 1.3;
        max-width: 70vw;
        max-height: calc(var(--look-label) * 1.3 * 2);
        overflow-wrap: anywhere;
      }
      .tag:empty {
        display: none;
      }
      /* In a short's split part the camera is below, not the platform's buttons. */
      [data-mode="split"] .tag {
        bottom: calc(var(--look-margin) * 0.55);
      }
      .kicker {
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
        color: var(--accent, #0071E3);
        max-width: 80vw;
        overflow-wrap: anywhere;
      }
      .kicker:empty {
        display: none;
      }
      @media (orientation: portrait) {
        .tag {
          bottom: 14vh;
          font-size: calc(var(--look-label) * 1.05);
          max-width: 80vw;
        }
        .kicker {
          font-size: calc(var(--look-label) * 1.3);
        }
      }

    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div id="card-back"></div>
      <div id="layout">
        <span class="kicker" id="label" data-var-text="label">The new settings page</span>
        <div id="frame">
          <img id="picture" alt="" />
          <div id="empty">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line x1="0" y1="0" x2="100" y2="100" />
              <line x1="100" y1="0" x2="0" y2="100" />
            </svg>
            <span id="missing">Picture</span>
          </div>
        </div>
        <p class="caption" id="caption" data-var-text="caption">Memory now has its own switch, off by default</p>
      </div>
      <span class="tag" id="source" data-var-text="source"></span>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 5;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      const text = (id, fallback = "") => String(vars[id] ?? fallback);
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      // Text a long value would push out of its box gets smaller until it fits (see count-up).
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }
      // The picture: a file in the graphic's folder; none (or one that won't load) leaves the
      // empty picture box.
      const picture = document.getElementById("picture");
      const file = text("picture").trim();
      const frame = document.getElementById("frame");
      const caption = document.getElementById("caption");
      // A file that isn't there is named in the empty box, so a wrong path shows.
      const missing = () => {
        root.dataset.empty = "";
        if (file) document.getElementById("missing").textContent = `No picture at ${file}`;
      };
      if (/^[\w./-]+\.(png|jpe?g|webp|svg)$/i.test(file) && !file.includes("..")) {
        picture.addEventListener("error", missing);
        // The frame takes the picture's shape, as large as the room allows, so the caption
        // sits right under it.
        picture.addEventListener("load", () => {
          const room = frame.getBoundingClientRect();
          const scale = Math.min(room.width / picture.naturalWidth, room.height / picture.naturalHeight);
          if (!(scale > 0)) return;
          frame.style.flex = "none";
          frame.style.width = `${picture.naturalWidth * scale}px`;
          frame.style.height = `${picture.naturalHeight * scale}px`;
          // The caption's rule matches the picture, unless that leaves the words too little room.
          caption.style.width = `${Math.max(picture.naturalWidth * scale, room.width * 0.6)}px`;
          fit(caption);
        });
        // A screenshot or a picture of the user's (not drawn for the look) gets a hairline
        // edge, so a white page doesn't run into the ground.
        if (/(^|\/)own-/.test(file)) root.dataset.edged = "";
        picture.src = file;
      } else {
        missing();
      }
      fit(document.getElementById("label"));
      fit(document.getElementById("caption"));
      fit(document.getElementById("source"));
      // When the caption lands: the cue, kept inside the clip.
      const cue = Math.min(Math.max(num("cue", 0.9), 0.3), Math.max(0.3, length - 1.2));
      const tl = gsap.timeline({ paused: true });
      tl.from("#label", { y: rise, opacity: 0 }, 0.05);
      tl.from("#frame", { y: rise, opacity: 0 }, 0.1);
      tl.from("#caption", { y: rise, opacity: 0 }, cue);
      tl.from("#source", { opacity: 0 }, cue + 0.15);
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
