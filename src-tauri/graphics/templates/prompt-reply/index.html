<!doctype html>
<!--
  Prompt and reply: an AeroEdits graphic (a HyperFrames composition), built like `blank` (see
  its notes): the look's tokens, the style's colours, a portrait block, cut unless eased.
  A demonstration: a chat window where the prompt types itself, is sent on the cue, and the
  reply streams in word by word. For "I asked it to...", "you tell the agent...": the actual
  words, not a card about them. `cue` is the second (into the graphic) the prompt is sent.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"App or agent","default":"Claude"},
    {"id":"prompt","type":"string","label":"Prompt","default":"Cut every silence longer than a second."},
    {"id":"reply","type":"string","label":"Reply","default":"Done: 34 silences cut, 1:42 in all. The video is now 10:22."},
    {"id":"cue","type":"number","label":"Sent at (s)","default":2.6,"min":0,"max":60},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Prompt and reply</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .window {
        /* Its own height even while the root has none (the chat is measured in the script). */
        flex: none;
        box-sizing: border-box;
        width: 64vw;
        height: 62vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        text-align: left;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 1vmin;
        padding: calc(var(--look-pad) * 0.7) var(--look-pad);
        border-bottom: var(--look-border) solid var(--look-line);
        font-size: var(--look-label);
        font-weight: 600;
        color: var(--look-muted);
      }
      .bar b {
        width: 1.3vmin;
        height: 1.3vmin;
        border-radius: 50%;
        background: var(--look-line);
      }
      .bar span {
        margin-left: 1vmin;
        max-width: 40vw;
        max-height: calc(var(--look-label) * 1.3);
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .messages {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: var(--look-gap);
        padding: var(--look-pad);
        min-height: 0;
      }
      .bubble {
        flex: none;
        box-sizing: border-box;
        max-width: 78%;
        max-height: 30vh;
        padding: calc(var(--look-pad) * 0.6) var(--look-pad);
        border-radius: var(--look-radius);
        font-size: var(--look-body);
        line-height: 1.35;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .mine {
        align-self: flex-end;
        background: var(--accent, #0071E3);
        color: var(--background, #FFFFFF);
      }
      .theirs {
        align-self: flex-start;
        background: var(--look-tint);
      }
      .dots {
        display: inline-flex;
        gap: 0.7vmin;
      }
      .dots i {
        width: 1.1vmin;
        height: 1.1vmin;
        border-radius: 50%;
        background: var(--look-muted);
      }
      .input {
        display: flex;
        align-items: center;
        gap: var(--look-gap);
        margin: 0 var(--look-pad) var(--look-pad);
        padding: calc(var(--look-pad) * 0.6) calc(var(--look-pad) * 0.6) calc(var(--look-pad) * 0.6) var(--look-pad);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
      }
      .typed {
        flex: 1;
        min-width: 0;
        max-height: calc(var(--look-body) * 1.35 * 2);
        font-size: var(--look-body);
        line-height: 1.35;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .caret {
        display: inline-block;
        width: 0.25vmin;
        height: 1.1em;
        margin-left: 0.15vmin;
        vertical-align: text-bottom;
        background: var(--accent, #0071E3);
      }
      .send {
        flex: none;
        display: grid;
        place-items: center;
        width: 6vmin;
        height: 6vmin;
        border-radius: 50%;
        background: var(--accent, #0071E3);
        color: var(--background, #FFFFFF);
      }
      .send svg {
        width: 3vmin;
        height: 3vmin;
      }
      @media (orientation: portrait) {
        .window {
          width: 88vw;
          height: 58vh;
        }
        .bubble,
        .typed {
          font-size: calc(var(--look-body) * 1.25);
        }
        .typed {
          max-height: calc(var(--look-body) * 1.25 * 1.35 * 3);
        }
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <div class="window card" id="window">
          <div class="bar"><b></b><b></b><b></b><span id="label" data-var-text="label">Claude</span></div>
          <div class="messages">
            <div class="bubble mine" id="sent"></div>
            <div class="bubble theirs" id="reply-box">
              <span class="dots" id="dots"><i></i><i></i><i></i></span>
              <span id="reply"></span>
            </div>
          </div>
          <div class="input">
            <div class="typed" id="typed"><span id="typing"></span><span class="caret" id="caret"></span></div>
            <div class="send" id="send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 8;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits: while more
      // than half a line spills (a line too many), and by width too (`wide`) where the box's
      // width doesn't follow its text. What spills after that is the letters themselves (a
      // font whose glyphs reach past tight lines, at any size): the box grows to hold them,
      // as shrinking would never stop.
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }

      const prompt = String(vars.prompt ?? "Cut every silence longer than a second.");
      const reply = String(vars.reply ?? "Done: 34 silences cut, 1:42 in all. The video is now 10:22.");
      // Letters and words as spans shown one by one: each appears by a set, so any seek draws
      // the same frame.
      const spans = (el, parts) =>
        parts.map((part) => {
          const span = document.createElement("span");
          span.textContent = part;
          span.style.display = "none";
          el.appendChild(span);
          return span;
        });
      const letters = spans(document.getElementById("typing"), Array.from(prompt));
      const words = spans(document.getElementById("reply"), reply.split(/(?<=\s)/));
      document.getElementById("sent").textContent = prompt;
      // Sized as it will be when everything shows.
      const typed = document.getElementById("typed");
      letters.forEach((s) => (s.style.display = "inline"));
      words.forEach((s) => (s.style.display = "inline"));
      fit(typed);
      [document.getElementById("sent"), document.getElementById("reply-box"), document.getElementById("label")].forEach((el) => fit(el));
      // The chat as it ends: when the prompt and the reply don't both fit the window (a short's
      // part is shorter), both get smaller, so the prompt isn't pushed out of the top.
      {
        const messages = document.querySelector(".messages");
        const bubbles = [document.getElementById("sent"), document.getElementById("reply-box")];
        const box = getComputedStyle(messages);
        const room =
          messages.clientHeight - parseFloat(box.paddingTop) - parseFloat(box.paddingBottom) - parseFloat(box.rowGap || "0");
        const unit = Math.min(innerWidth, innerHeight) / 100;
        for (let n = 0; n < 30 && room > 0 && bubbles.reduce((h, b) => h + b.offsetHeight, 0) > room; n++) {
          bubbles.forEach((b) => {
            b.style.fontSize = `${(parseFloat(getComputedStyle(b).fontSize) * 0.93) / unit}vmin`;
          });
        }
      }
      letters.forEach((s) => (s.style.display = "none"));
      words.forEach((s) => (s.style.display = "none"));

      // In a short placement everything comes sooner, so the reply still shows.
      const cue = Math.min(Math.max(num("cue", 2.6), 0.4), Math.max(0.4, length * 0.45));
      const tl = gsap.timeline({ paused: true });
      tl.from("#window", { y: rise, opacity: 0 }, 0.1);
      tl.set(["#sent", "#reply-box"], { display: "none" }, 0);
      // Typing, evenly, up to just before the cue.
      const typeFrom = Math.min(0.45, cue * 0.3), typeTo = Math.max(typeFrom + 0.2, cue - 0.25);
      letters.forEach((s, i) => tl.set(s, { display: "inline" }, typeFrom + (typeTo - typeFrom) * (i / letters.length)));
      tl.to("#caret", { opacity: 0, duration: 0.01, repeat: Math.floor(cue / 0.5), yoyo: true, repeatDelay: 0.49 }, 0);
      // Sent: the button presses, the input clears, the prompt goes up as a message.
      tl.to("#send", { scale: 0.86, duration: 0.12, ease: "power1.in", yoyo: true, repeat: 1 }, cue - 0.1);
      tl.set(letters, { display: "none" }, cue + 0.05);
      tl.set("#sent", { display: "block" }, cue + 0.05);
      tl.from("#sent", { y: rise, opacity: 0 }, cue + 0.05);
      // The reply: thinking dots, then its words stream in.
      const after = length - cue;
      const think = Math.min(1.4, after * 0.3);
      tl.set("#reply-box", { display: "block" }, cue + think * 0.3);
      tl.from("#reply-box", { y: rise, opacity: 0 }, cue + think * 0.3);
      tl.to("#dots i", { y: "-0.8vmin", duration: 0.25, ease: "sine.inOut", stagger: 0.12, yoyo: true, repeat: 3 }, cue + think * 0.35);
      const streamFrom = cue + think;
      const streamTo = Math.max(streamFrom + 0.3, Math.min(streamFrom + words.length * 0.11, length - Math.min(1.5, after * 0.25)));
      tl.set("#dots", { display: "none" }, streamFrom);
      words.forEach((s, i) => tl.set(s, { display: "inline" }, streamFrom + (streamTo - streamFrom) * (i / words.length)));
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
