<!doctype html>
<!--
  A blank AeroEdits graphic: a HyperFrames composition.
  - It plays full screen over the video (16:9, or a short's 9:16), so lay it out in the
    viewport with vw/vh/vmin and an @media (orientation: portrait) block; AeroEdits sets the
    root's data-width, data-height and data-duration to the canvas and clip when it renders.
  - The look: every graphic in a video shares one. Take sizes, corners, borders, shadows, gaps
    and motion from the --look-* tokens below (AeroEdits sets them for the video after this
    block), and colours from var(--background), var(--text), var(--accent) and the roles
    --look-muted, --look-line, --look-tint, --look-wash, --look-shadow. Never write a colour,
    font, radius or duration of your own: graphic_check flags them. Classes .pill, .title,
    .muted and .card below are the look's building blocks.
  - Keep the page transparent and draw your own background (#card-back below).
  - In and out: a graphic that fills the frame never eases in or out; it cuts. Only a graphic
    laid over the full-screen camera eases. AeroEdits decides which from where the graphic
    plays and sets data-entrance on the root to "cut" or "ease": show the card whole from the
    first frame to the last unless root.dataset.entrance is "ease", and only then fade or
    slide it in and out. A graphic that covers only part of the frame (a lower third, a
    callout) says so with data-overlay on the root; without it AeroEdits treats the graphic
    as full screen and always cuts it. Motion inside the card (text rising, a bar growing) is
    fine either way.
  - A graphic that holds to the end of its clip (an end card) says so with data-holds-end on
    the root and, when it eases, fades in only.
  - Motion: GSAP 3.15 works offline. Load it by file name (<script src="gsap.min.js">, a plugin
    as SplitText.min.js, CustomEase.min.js...); AeroEdits puts the files beside this one when
    it renders, and turns a CDN link to GSAP into that name. Build one paused timeline as long
    as the clip and register it as window.__timelines["graphic"]; HyperFrames seeks it. Take
    durations and easing from the look (see gsap.defaults below). The Web Animations API
    (paused, finite) works too: then mark the root data-no-timeline.
  - No other network: no CDN scripts or web fonts; put any images next to this file.
  - Declare what should be editable in data-composition-variables on <html>; read values with
    data-var-text / var(--id) or window.__hyperframes.getVariables().
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"Your title"},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Graphic</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }

    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <h1 class="title" id="title" data-var-text="title">Your title</h1>
      </div>
    </div>
    <script>

      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 4;
      // The video's look: durations and easing for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { y: token("distance", "1.8vmin"), opacity: 0 }, 0.15);
      // Full screen: cut in and out unless AeroEdits asks for an ease (see the note above).
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
