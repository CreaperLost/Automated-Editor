<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"Recap"},
    {"id":"items","type":"string","label":"Items (one per line, up to 6)","default":"Install the tools\nCreate the project\nRun it locally\nDeploy it"},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Recap checklist</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .list {
        list-style: none;
        margin: 0;
        padding: calc(var(--look-pad) * 0.6) calc(var(--look-pad) * 1.4);
        width: min(70vw, 130vmin);
        text-align: left;
      }
      .list li {
        display: flex;
        align-items: center;
        gap: calc(var(--look-gap) * 0.9);
        padding: calc(var(--look-pad) * 0.75) 0;
        font-size: var(--look-body);
        font-weight: 500;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .list li + li {
        border-top: var(--look-border) solid var(--look-line);
      }
      .tick {
        flex: none;
        display: grid;
        place-items: center;
        width: 4.6vmin;
        height: 4.6vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
      }
      .tick svg {
        width: 2.8vmin;
        height: 2.8vmin;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tick path {
        stroke-dasharray: 30;
      }
      @media (orientation: portrait) {
        .list {
          width: 100%;
        }
        .list li {
          font-size: calc(var(--look-body) * 1.4);
        }
        .tick {
          width: 6vmin;
          height: 6vmin;
        }
        .tick svg {
          width: 3.6vmin;
          height: 3.6vmin;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic" data-no-timeline
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <h1 class="title" id="title" data-var-text="title">Recap</h1>
        <ul class="list card" id="items"></ul>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      // The video's look (see the style above).
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const look = {
        duration: parseFloat(token("duration", "700")),
        stagger: parseFloat(token("stagger", "90")),
        out: parseFloat(token("out", "350")),
        ease: token("ease", "cubic-bezier(0.22, 1, 0.36, 1)"),
        distance: token("distance", "1.8vmin"),
        entry: token("entry", "rise"),
      };
      root.dataset.align = token("align", "center");
      const length = (parseFloat(root.dataset.duration) || 6) * 1000;
      const eases = root.dataset.entrance === "ease";
      const outAt = Math.max(1200, length - look.out - 100);
      // Text a long value would push out of its box (its max-height) gets smaller until it
      // fits. It wraps anywhere, so only its height can overflow.
      function fit(el) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        // Glyphs reach a little past tight lines; only a real extra line counts.
        for (let n = 0; n < 40 && el.scrollHeight - el.clientHeight > size * 0.25; n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
      }
      function play(el, frames, delay, duration = look.duration, easing = look.ease) {
        (typeof el === "string" ? document.getElementById(el) : el)
          .animate(frames, { duration, delay, easing, fill: "both", iterations: 1 })
          .pause();
      }
      // How things come in, by the look: rise, fade, scale or blur, over its distance.
      function enter(el, delay, opacity = 1) {
        const from = { opacity: 0, transform: "none", filter: "none" };
        if (look.entry === "rise") from.transform = `translateY(${look.distance})`;
        if (look.entry === "scale") from.transform = `translateY(${look.distance}) scale(0.92)`;
        if (look.entry === "blur") {
          from.transform = `translateY(${look.distance})`;
          from.filter = "blur(1.2vmin)";
        }
        play(el, [from, { opacity, transform: "none", filter: "none" }], delay);
      }
      const items = String(vars.items ?? "Install the tools\nCreate the project\nRun it locally\nDeploy it")
        .split(/\r?\n|\|/)
        .map((s) => s.trim())
        .filter(Boolean)
        .slice(0, 6);
      const list = document.getElementById("items");
      items.forEach((text, i) => {
        const li = document.createElement("li");
        li.id = `item-${i}`;
        li.innerHTML =
          `<span class="tick"><svg viewBox="0 0 24 24"><path id="tick-${i}" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>` +
          `<span></span>`;
        li.lastChild.textContent = text;
        list.appendChild(li);
      });
      if (!items.length) list.style.display = "none";
      fit(document.getElementById("title"));
      enter("title", 150);
      enter("items", 300);
      // Items arrive one after another across the first half, each ticked as it lands.
      const gap = Math.min(450, Math.max(180, (length * 0.5 - 600) / Math.max(1, items.length)));
      items.forEach((_, i) => {
        const at = 450 + i * gap;
        enter(`item-${i}`, at);
        play(`tick-${i}`, [{ strokeDashoffset: 30 }, { strokeDashoffset: 0 }], at + 250, 400, "ease-out");
      });
      // The card fills the frame, so it cuts in and out. Only when AeroEdits asks for an ease
      // (in a short's slot over the full-screen camera) does it fade in and out.
      if (eases) {
        play("card-back", [
          { opacity: 0 },
          { opacity: 1, offset: 300 / length },
          { opacity: 1, offset: outAt / length },
          { opacity: 0 },
        ], 0, length, "linear");
        play("layout", [{ opacity: 1 }, { opacity: 0 }], outAt, look.out);
      }
    </script>
  </body>
</html>
