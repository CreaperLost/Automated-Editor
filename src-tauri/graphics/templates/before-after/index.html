<!doctype html>
<!--
  Before and after: an AeroEdits graphic (a HyperFrames composition), built like `blank` (see
  its notes): the look's tokens, the style's colours, a portrait block, cut unless eased.
  A demonstration: one card shows the before; on the cue a line sweeps across it and leaves
  the after behind, in the same frame, so the change itself is what the viewer sees. For a
  result, a fix, a comparison of two states. `cue` is the second (into the graphic) the sweep
  starts.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label","default":"After the cleanup"},
    {"id":"beforeLabel","type":"string","label":"Before, its tag","default":"Before"},
    {"id":"before","type":"string","label":"Before","default":"12:04"},
    {"id":"beforeDetail","type":"string","label":"Before, the line under it","default":"with 34 silences and 6 retakes"},
    {"id":"afterLabel","type":"string","label":"After, its tag","default":"After"},
    {"id":"after","type":"string","label":"After","default":"10:22"},
    {"id":"afterDetail","type":"string","label":"After, the line under it","default":"every pause tight, every take clean"},
    {"id":"cue","type":"number","label":"Sweeps at (s)","default":1.6,"min":0,"max":60},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Before and after</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .stage {
        position: relative;
        flex: none;
        box-sizing: border-box;
        width: 70vw;
        height: 44vh;
        overflow: hidden;
      }
      .state {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(var(--look-gap) * 0.8);
        padding: var(--look-pad) calc(var(--look-pad) * 2);
        border-radius: var(--look-radius);
      }
      .state.was {
        background: var(--background, #FFFFFF);
      }
      .state.now {
        background: var(--look-tint);
      }
      .value {
        flex: none;
        max-width: 60vw;
        max-height: calc(var(--look-title) * 1.6 * 1.25);
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: calc(var(--look-title) * 1.6);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: 1.25;
      }
      .was .value {
        color: var(--look-muted);
      }
      .now .value {
        color: var(--accent, #0071E3);
      }
      .state .muted {
        flex: none;
      }
      /* As wide as the stage, so moving it by xPercent moves the line across the stage. */
      .sweep {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .sweep i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0.5vmin;
        border-radius: 99vmin;
        background: var(--accent, #0071E3);
      }
      @media (orientation: portrait) {
        .stage {
          width: 88vw;
          height: 50vh;
        }
        .value {
          font-size: calc(var(--look-title) * 1.7);
          max-height: calc(var(--look-title) * 1.7 * 1.25 * 2);
        }
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <span class="pill" id="label" data-var-text="label">After the cleanup</span>
        <div class="stage card" id="stage">
          <!-- The after covers the before on purpose: that is the sweep. -->
          <div class="state was" id="was" data-layout-allow-occlusion data-layout-allow-overlap>
            <span class="pill" id="before-label" data-layout-allow-occlusion data-var-text="beforeLabel">Before</span>
            <div class="value" id="before" data-layout-allow-occlusion data-var-text="before">12:04</div>
            <p class="muted" id="before-detail" data-layout-allow-occlusion data-var-text="beforeDetail">with 34 silences and 6 retakes</p>
          </div>
          <div class="state now" id="now" data-layout-allow-occlusion data-layout-allow-overlap>
            <span class="pill" id="after-label" data-var-text="afterLabel">After</span>
            <div class="value" id="after" data-var-text="after">10:22</div>
            <p class="muted" id="after-detail" data-var-text="afterDetail">every pause tight, every take clean</p>
          </div>
          <div class="sweep" id="sweep" data-layout-allow-overflow><i></i></div>
        </div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 6;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits: while more
      // than half a line spills (a line too many), and by width too (`wide`) where the box's
      // width doesn't follow its text. What spills after that is the letters themselves (a
      // font whose glyphs reach past tight lines, at any size): the box grows to hold them,
      // as shrinking would never stop.
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }

      ["before", "after"].forEach((id) => fit(document.getElementById(id)));
      ["before-detail", "after-detail"].forEach((id) => fit(document.getElementById(id)));
      // In a short placement the sweep comes sooner, so the after still shows.
      const cue = Math.min(Math.max(num("cue", 1.6), 0.3), Math.max(0.3, length * 0.45));
      const sweep = Math.max(seconds * 1.4, 0.7);

      const tl = gsap.timeline({ paused: true });
      tl.from("#label", { y: rise, opacity: 0 }, 0.1);
      tl.from("#stage", { y: rise, opacity: 0 }, 0.15);
      // The after waits behind a clip; the line sweeps and the clip follows it.
      tl.set("#now", { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.set("#sweep", { opacity: 0 }, 0);
      tl.set("#sweep", { opacity: 1 }, cue);
      tl.to("#now", { clipPath: "inset(0 0% 0 0)", duration: sweep, ease: "power2.inOut" }, cue);
      tl.fromTo("#sweep", { xPercent: 0 }, { xPercent: 100, duration: sweep, ease: "power2.inOut" }, cue);
      tl.to("#sweep", { opacity: 0, duration: 0.2, ease: "power1.out" }, cue + sweep);
      tl.set("#was", { opacity: 0 }, cue + sweep);
      // Landed: the after's value settles in.
      tl.from("#after", { scale: 0.96, duration: seconds, ease: "back.out(1.6)" }, cue + sweep * 0.6);
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
