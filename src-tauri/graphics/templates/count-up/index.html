<!doctype html>
<!--
  Number count-up: an AeroEdits graphic (a HyperFrames composition), built like `blank` (see
  its notes): the look's tokens, the style's colours, a portrait block, cut unless eased.
  A spoken number as the hero: its digits roll up like a counter from the cue and land on the
  number, with a label above and a line under it. For an amount, a count, a percentage the
  speaker gives. Digits roll; commas, points and spaces in `number` stay put. `cue` is the
  second (into the graphic) the digits start.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label","default":"Prize pool"},
    {"id":"number","type":"string","label":"Number","default":"18,888"},
    {"id":"prefix","type":"string","label":"Before the number","default":""},
    {"id":"suffix","type":"string","label":"After the number","default":"USDC"},
    {"id":"detail","type":"string","label":"Detail","default":"Shared by everyone who trades in the ten days"},
    {"id":"cue","type":"number","label":"Counts from (s)","default":0.5,"min":0,"max":60},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Number count-up</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .hero {
        /* Never squeezed by the column: HyperFrames sizes the page after the script runs. */
        flex: none;
        display: flex;
        align-items: baseline;
        justify-content: center;
        flex-wrap: wrap;
        gap: calc(var(--look-gap) * 0.4) calc(var(--look-gap) * 0.6);
        max-width: 84vw;
        max-height: calc(var(--look-title) * 1.9 * 2.3);
        overflow: hidden;
        font-size: calc(var(--look-title) * 1.9);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: 1.1;
        color: var(--accent, #0071E3);
      }
      .number {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 84vw;
        font-variant-numeric: tabular-nums;
      }
      .wheel {
        display: inline-block;
        vertical-align: top;
        height: 1.1em;
        overflow: hidden;
      }
      .wheel span {
        display: block;
        height: 1.1em;
      }
      .affix {
        font-size: 0.42em;
        color: var(--text, #1D1D1F);
        overflow-wrap: anywhere;
      }
      .affix:empty {
        display: none;
      }
      /* A sign ("$", "€", "%") belongs to the number: its size, right against it. */
      .affix.sign {
        font-size: 1em;
        color: var(--accent, #0071E3);
      }
      #prefix.sign {
        margin-inline-end: calc(var(--look-gap) * -0.6);
      }
      #suffix.sign {
        margin-inline-start: calc(var(--look-gap) * -0.6);
      }
      @media (orientation: portrait) {
        .hero {
          font-size: calc(var(--look-title) * 2.1);
          max-height: calc(var(--look-title) * 2.1 * 1.1 * 3);
        }
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <span class="pill" id="label" data-var-text="label">Prize pool</span>
        <div class="hero" id="hero">
          <span class="affix" id="prefix" data-var-text="prefix"></span>
          <span class="number" id="number"></span>
          <span class="affix" id="suffix" data-var-text="suffix">USDC</span>
        </div>
        <p class="muted" id="detail" data-var-text="detail">Shared by everyone who trades in the ten days</p>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 5;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits: while more
      // than half a line spills (a line too many), and by width too (`wide`) where the box's
      // width doesn't follow its text. What spills after that is the letters themselves (a
      // font whose glyphs reach past tight lines, at any size): the box grows to hold them,
      // as shrinking would never stop.
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }

      for (const id of ["prefix", "suffix"]) {
        const text = String(vars[id] ?? "").trim();
        if (text && Array.from(text).length <= 2) document.getElementById(id).classList.add("sign");
      }
      const number = String(vars.number ?? "18,888");
      const holder = document.getElementById("number");
      // Each digit a wheel of 0-9 turned some times round, the rightmost the most, landing on
      // the digit; anything else (a comma, a point) stands still.
      const chars = Array.from(number);
      const digits = chars.filter((c) => /\d/.test(c)).length;
      let seen = 0;
      const wheels = [];
      chars.forEach((c) => {
        if (!/\d/.test(c)) {
          const still = document.createElement("span");
          still.textContent = c;
          holder.appendChild(still);
          return;
        }
        seen += 1;
        const turns = 1 + Math.min(2, digits - seen);
        // The wheel hides the digits it isn't showing on purpose.
        const wheel = document.createElement("span");
        wheel.className = "wheel";
        wheel.setAttribute("data-layout-allow-occlusion", "");
        wheel.setAttribute("data-layout-allow-overflow", "");
        const strip = document.createElement("span");
        strip.setAttribute("data-layout-allow-occlusion", "");
        for (let n = 0; n <= turns * 10 + Number(c); n++) {
          const d = document.createElement("span");
          d.textContent = String(n % 10);
          d.setAttribute("data-layout-allow-occlusion", "");
          strip.appendChild(d);
        }
        wheel.appendChild(strip);
        holder.appendChild(wheel);
        wheels.push({ strip, stop: turns * 10 + Number(c) });
      });
      // Shown landed while it is sized.
      wheels.forEach((w) => gsap.set(w.strip, { y: `-${w.stop * 1.1}em` }));
      fit(document.getElementById("hero"));
      fit(document.getElementById("detail"));

      const cue = Math.min(Math.max(num("cue", 0.5), 0.2), Math.max(0.2, length - 2.2));
      const roll = Math.max(seconds * 2.2, 1.4);
      const tl = gsap.timeline({ paused: true });
      tl.from("#label", { y: rise, opacity: 0 }, 0.1);
      tl.from("#hero", { y: rise, opacity: 0 }, 0.15);
      wheels.forEach((w) =>
        tl.fromTo(w.strip, { y: 0 }, { y: `-${w.stop * 1.1}em`, duration: roll, ease: "power3.out" }, cue)
      );
      tl.from("#detail", { y: rise, opacity: 0 }, cue + roll * 0.7);
      // Landed: one quiet breath on the number.
      tl.to("#hero", { scale: 1.03, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, cue + roll);
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
