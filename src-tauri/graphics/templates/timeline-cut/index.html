<!doctype html>
<!--
  Timeline, gaps closed: an AeroEdits graphic (a HyperFrames composition), built like `blank` (see
  its notes): the look's tokens, the style's colours, a portrait block, cut unless eased.
  A demonstration: a timeline whose silent gaps close up on the cue, while its length ticks
  from `before` to `after`. For cutting silence, pauses, retakes: what a cut does, shown.
  `cue` is the second (into the graphic) the gaps close: put it on the word that says so.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label","default":"Silence removed"},
    {"id":"title","type":"string","label":"Title","default":"1:42 of silence, gone"},
    {"id":"before","type":"string","label":"Length before","default":"12:04"},
    {"id":"after","type":"string","label":"Length after","default":"10:22"},
    {"id":"cue","type":"number","label":"Gaps close at (s)","default":1.8,"min":0,"max":60},
    {"id":"background","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"text","type":"color","label":"Text","default":"#1D1D1F"},
    {"id":"accent","type":"color","label":"Accent","default":"#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Timeline, gaps closed</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }
      .lane {
        box-sizing: border-box;
        width: 78vw;
        padding: calc(var(--look-pad) * 1.2);
        display: flex;
        flex-direction: column;
        gap: calc(var(--look-gap) * 0.8);
      }
      .row {
        display: flex;
        height: 9vmin;
        align-self: flex-start;
      }
      .clip {
        flex: none;
        box-sizing: border-box;
        border-radius: var(--look-radius-small);
        background: color-mix(in srgb, var(--accent, #0071E3) 18%, var(--background, #FFFFFF));
        border: var(--look-border) solid color-mix(in srgb, var(--accent, #0071E3) 45%, var(--background, #FFFFFF));
        display: flex;
        align-items: center;
        gap: 0.35vmin;
        padding: 0 0.9vmin;
        overflow: hidden;
      }
      .clip i {
        flex: none;
        width: 0.35vmin;
        border-radius: 99vmin;
        background: color-mix(in srgb, var(--accent, #0071E3) 70%, var(--background, #FFFFFF));
      }
      .gap {
        flex: none;
        box-sizing: border-box;
        height: 100%;
        border-radius: var(--look-radius-small);
        background: repeating-linear-gradient(135deg, var(--look-line) 0 0.45vmin, transparent 0.45vmin 1.1vmin);
        overflow: hidden;
      }
      .meter {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--look-gap);
        font-size: var(--look-label);
        color: var(--look-muted);
      }
      .swap {
        display: grid;
      }
      .swap > * {
        grid-area: 1 / 1;
      }
      .length {
        font-size: var(--look-heading);
        font-weight: var(--look-title-weight);
        color: var(--text, #1D1D1F);
        font-variant-numeric: tabular-nums;
        letter-spacing: var(--look-title-tracking);
        max-width: 60vw;
        max-height: calc(var(--look-heading) * 1.3);
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      @media (orientation: portrait) {
        .lane {
          width: 86vw;
        }
        .row {
          height: 7vmin;
        }
        .length {
          font-size: calc(var(--look-heading) * 1.3);
          max-height: calc(var(--look-heading) * 1.3 * 1.3);
        }
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <span class="pill" id="label" data-var-text="label">Silence removed</span>
        <h1 class="title" id="title" data-var-text="title">1:42 of silence, gone</h1>
        <div class="lane card" id="lane">
          <div class="row" id="row"></div>
          <div class="meter">
            <span class="swap">
              <span class="length" id="before" data-var-text="before">12:04</span>
              <span class="length" id="after" data-var-text="after">10:22</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 6;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits: while more
      // than half a line spills (a line too many), and by width too (`wide`) where the box's
      // width doesn't follow its text. What spills after that is the letters themselves (a
      // font whose glyphs reach past tight lines, at any size): the box grows to hold them,
      // as shrinking would never stop.
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }

      // The timeline: clips with silent gaps between them (shares of the lane's width).
      const clips = [13, 8, 16, 6, 11, 14, 9];
      const gaps = [5, 3.5, 6, 4, 5.5, 3];
      const row = document.getElementById("row");
      const lane = document.getElementById("lane");
      const unit = Math.min(innerWidth, innerHeight) / 100;
      const pad = parseFloat(getComputedStyle(lane).paddingLeft) || 0;
      // Sized from the lane as laid out, so it fits any canvas.
      const px = (lane.clientWidth - 2 * pad) / [...clips, ...gaps].reduce((a, b) => a + b, 0);
      const gapEls = [];
      clips.forEach((share, i) => {
        const clip = document.createElement("div");
        clip.className = "clip";
        clip.style.width = `${share * px}px`;
        // A little waveform, the same every render, as many bars as the clip holds.
        const bars = Math.max(1, Math.floor((share * px - 1.8 * unit) / (0.7 * unit)));
        for (let b = 0; b < bars; b++) {
          const bar = document.createElement("i");
          bar.style.height = `${2 + ((b * 37 + i * 11) % 9) * 0.6}vmin`;
          clip.appendChild(bar);
        }
        row.appendChild(clip);
        if (i < gaps.length) {
          const gap = document.createElement("div");
          gap.className = "gap";
          gap.style.width = `${gaps[i] * px}px`;
          row.appendChild(gap);
          gapEls.push(gap);
        }
      });
      ["title", "before", "after"].forEach((id) => fit(document.getElementById(id)));
      const cue = Math.min(Math.max(num("cue", 1.8), 0.6), Math.max(0.6, length - 1.8));
      const close = Math.max(seconds * 1.3, 0.8);

      const tl = gsap.timeline({ paused: true });
      tl.from(["#label", "#title"], { y: rise, opacity: 0, stagger: stagger }, 0.1);
      tl.from("#lane", { y: rise, opacity: 0 }, 0.25);
      // The gaps show what goes, then close; the clips slide together.
      tl.to(gapEls, { opacity: 0.35, duration: 0.25, ease: "power1.inOut", yoyo: true, repeat: 1 }, Math.max(0.4, cue - 0.6));
      tl.to(gapEls, { width: 0, duration: close, ease: "power2.inOut" }, cue);
      // The length hands over from before to after as the gaps close.
      tl.set("#after", { opacity: 0 }, 0);
      tl.to("#before", { y: `-${rise}`, opacity: 0, duration: out, ease: "power2.in" }, cue + close * 0.35);
      tl.fromTo("#after", { y: rise, opacity: 0 }, { y: 0, opacity: 1 }, cue + close * 0.5);
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
