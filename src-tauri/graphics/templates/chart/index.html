<!doctype html>
<!--
  Line chart: an AeroEdits graphic (a HyperFrames composition), built like bars. A number over
  time (`points`: "Label: value" split by "|", up to twelve, in order) as one ink line over a
  baseline with the labels under it; on `cue` the line draws from left to right and the point
  named in `highlight` (the last when none) lands in the accent with its value and `unit`.
  For a trend: prices over months, users over years, a score falling.
  Every change is a tween or a set on a paused GSAP timeline, so any seek draws the same frame.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id": "label", "type": "string", "label": "Title", "default": "Weekly users, millions"},
    {"id": "points", "type": "string", "label": "Points (Label: value, split by |)", "default": "Jan: 12|Feb: 15|Mar: 14|Apr: 22|May: 31|Jun: 18"},
    {"id": "unit", "type": "string", "label": "Unit before or after", "default": "m"},
    {"id": "highlight", "type": "string", "label": "Point in the accent", "default": "May"},
    {"id": "source", "type": "string", "label": "Source tag", "default": "Source: company filings"},
    {"id": "cue", "type": "number", "label": "The line draws at (s)", "default": 1, "min": 0, "max": 60},
    {"id": "background", "type": "color", "label": "Background", "default": "#FFFFFF"},
    {"id": "text", "type": "color", "label": "Text", "default": "#1D1D1F"},
    {"id": "accent", "type": "color", "label": "Accent", "default": "#0071E3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Line chart</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The look: AeroEdits sets these for the whole video after this block (the defaults here
         are its "App" look). Sizes, corners, gaps and motion come from them, colours from the
         background, text and accent variables (the brand kit's). */
      [data-composition-id] {
        --look-font: var(--brand-font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif);
        --look-align: center;
        --look-body: 3.8vmin;
        --look-border: 0.12vmin;
        --look-distance: 1.8vmin;
        --look-duration: 700;
        --look-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --look-entry: rise;
        --look-gap: 2.2vmin;
        --look-gsap-ease: expo.out;
        --look-heading: 5.2vmin;
        --look-label: 3vmin;
        --look-label-case: none;
        --look-label-tracking: 0em;
        --look-leading: 1.15;
        --look-line-mix: 8%;
        --look-margin: 8vw;
        --look-muted-mix: 62%;
        --look-out: 350;
        --look-pad: 2.6vmin;
        --look-radius: 2.6vmin;
        --look-radius-small: 1.4vmin;
        --look-shadow-mix: 5%;
        --look-stagger: 90;
        --look-tint-mix: 10%;
        --look-title: 8vmin;
        --look-title-tracking: -0.035em;
        --look-title-weight: 650;
        --look-wash-mix: 5%;
        --look-muted: color-mix(in srgb, var(--text, #1D1D1F) var(--look-muted-mix), var(--background, #FFFFFF));
        --look-line: color-mix(in srgb, var(--text, #1D1D1F) var(--look-line-mix), var(--background, #FFFFFF));
        --look-tint: color-mix(in srgb, var(--accent, #0071E3) var(--look-tint-mix), var(--background, #FFFFFF));
        --look-wash: color-mix(in srgb, var(--accent, #0071E3) var(--look-wash-mix), transparent);
        --look-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--text, #1D1D1F) var(--look-shadow-mix), transparent);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text, #1d1d1f);
        font-family: var(--look-font);
        -webkit-font-smoothing: antialiased;
      }
      #card-back {
        position: absolute;
        inset: 0;
        background: var(--background, #ffffff);
      }
      #card-back::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 15% 90%, var(--look-wash), transparent 60%),
          radial-gradient(ellipse at 90% 5%, var(--look-wash), transparent 55%);
      }
      .layout {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--look-gap);
        padding: 0 var(--look-margin);
        text-align: center;
      }
      [data-align="left"] .layout {
        align-items: flex-start;
        text-align: left;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 1vmin;
        padding: 0.7vmin 1.8vmin;
        border-radius: 99vmin;
        background: var(--look-tint);
        color: var(--accent, #0071e3);
        font-size: var(--look-label);
        font-weight: 600;
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
      }
      .pill:empty {
        display: none;
      }
      .title {
        margin: 0;
        font-size: var(--look-title);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: var(--look-leading);
        max-width: 80vw;
        max-height: calc(var(--look-title) * var(--look-leading) * 3);
        overflow-wrap: anywhere;
      }
      .muted {
        margin: 0;
        font-size: var(--look-body);
        line-height: 1.35;
        color: var(--look-muted);
        max-width: 70vw;
        max-height: calc(var(--look-body) * 1.35 * 2);
        overflow-wrap: anywhere;
      }
      .muted:empty {
        display: none;
      }
      .card {
        box-sizing: border-box;
        background: var(--background, #ffffff);
        border: var(--look-border) solid var(--look-line);
        border-radius: var(--look-radius);
        box-shadow: var(--look-shadow);
      }
      /* Over a picture that shows through (over the face in a short, data-mode="over"): no
         background of its own; the content sits on a panel in the lower part of the frame. */
      [data-mode="over"] #card-back {
        display: none;
      }
      [data-mode="over"] .layout {
        inset: auto 6% 8% 6%;
        padding: calc(var(--look-pad) * 1.6) calc(var(--look-pad) * 1.8);
        border-radius: calc(var(--look-radius) * 1.3);
        background: var(--background, #ffffff);
        box-shadow: var(--look-shadow), 0 2vmin 6vmin color-mix(in srgb, var(--text, #1d1d1f) 22%, transparent);
      }
      [data-mode="over"] .layout > * {
        zoom: 0.8;
      }
      [data-mode="over"] .layout .card {
        border: none;
        box-shadow: none;
      }
      @media (orientation: portrait) {
        .layout {
          padding: 0 calc(var(--look-margin) * 0.8);
          gap: calc(var(--look-gap) * 1.2);
        }
        .pill {
          font-size: calc(var(--look-label) * 1.35);
          padding: 1vmin 2.4vmin;
        }
        .title {
          font-size: calc(var(--look-title) * 1.35);
          max-width: none;
          max-height: calc(var(--look-title) * 1.35 * var(--look-leading) * 4);
        }
        .muted {
          font-size: calc(var(--look-body) * 1.4);
          max-width: none;
          max-height: calc(var(--look-body) * 1.4 * 1.35 * 3);
        }
      }

      /* A source tag: where a claim, number or quote on screen comes from. */
      .tag {
        position: absolute;
        left: var(--look-margin);
        bottom: calc(var(--look-margin) * 0.55);
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        letter-spacing: 0.04em;
        color: var(--look-muted);
        line-height: 1.3;
        max-width: 70vw;
        max-height: calc(var(--look-label) * 1.3 * 2);
        overflow-wrap: anywhere;
      }
      .tag:empty {
        display: none;
      }
      /* In a short's split part the camera is below, not the platform's buttons. */
      [data-mode="split"] .tag {
        bottom: calc(var(--look-margin) * 0.55);
      }
      .kicker {
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: var(--look-label);
        letter-spacing: var(--look-label-tracking);
        text-transform: var(--look-label-case);
        color: var(--accent, #0071E3);
        max-width: 80vw;
        overflow-wrap: anywhere;
      }
      .kicker:empty {
        display: none;
      }
      @media (orientation: portrait) {
        .tag {
          bottom: 14vh;
          font-size: calc(var(--look-label) * 1.05);
          max-width: 80vw;
        }
        .kicker {
          font-size: calc(var(--look-label) * 1.3);
        }
      }

      .chart {
        display: flex;
        flex-direction: column;
        gap: calc(var(--look-gap) * 1.2);
        width: min(84vw, 160vmin);
        text-align: left;
      }
      .chart .heading {
        margin: 0;
        font-size: calc(var(--look-heading) * 1.25);
        font-weight: var(--look-title-weight);
        letter-spacing: var(--look-title-tracking);
        line-height: 1.15;
        max-height: calc(var(--look-heading) * 1.25 * 1.15 * 2);
        overflow-wrap: anywhere;
      }
      /* The plot: the line in an SVG drawn in the box's own pixels, the marker and the labels
         laid over it in percent. */
      .plot {
        position: relative;
        height: 38vh;
        margin-top: calc(var(--look-label) * 0.5);
        border-bottom: calc(var(--look-border) * 3) solid var(--text, #1D1D1F);
      }
      .plot svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .plot path {
        fill: none;
        stroke: var(--text, #1D1D1F);
        stroke-width: calc(var(--look-border) * 4);
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .marker {
        position: absolute;
        width: 2.6vmin;
        height: 2.6vmin;
        margin: -1.3vmin 0 0 -1.3vmin;
        background: var(--accent, #0071E3);
      }
      .reading {
        position: absolute;
        transform: translate(-50%, -100%);
        margin-top: -2.2vmin;
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: calc(var(--look-body) * 1.3);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent, #0071E3);
        line-height: 1.15;
        width: max-content;
        max-width: 28vw;
        max-height: calc(var(--look-body) * 1.3 * 1.15 * 2);
        text-align: center;
        overflow-wrap: anywhere;
      }
      .ticks {
        position: relative;
        height: calc(var(--look-label) * 1.2 * 1.3);
      }
      .tick {
        position: absolute;
        transform: translateX(-50%);
        font-family: var(--brand-data-font, var(--brand-body-font, var(--look-font)));
        font-size: calc(var(--look-label) * 1.2);
        line-height: 1.3;
        color: var(--look-muted);
        white-space: nowrap;
      }
      .tick.on {
        color: var(--accent, #0071E3);
      }
      @media (orientation: portrait) {
        #layout {
          padding-bottom: calc(14vh + var(--look-label) * 3);
        }
        .chart {
          width: 100%;
          gap: calc(var(--look-gap) * 1.4);
        }
        .chart .heading {
          font-size: calc(var(--look-heading) * 1.6);
          max-height: calc(var(--look-heading) * 1.6 * 1.15 * 3);
        }
        .plot {
          height: 32vh;
          margin-top: calc(var(--look-label) * 1.5);
        }
        .reading {
          font-size: calc(var(--look-body) * 2);
          max-width: 44vw;
          max-height: calc(var(--look-body) * 2 * 1.15 * 2);
        }
        .tick {
          font-size: calc(var(--look-label) * 1.8);
        }
        .ticks {
          height: calc(var(--look-label) * 1.8 * 1.3);
        }
      }
      [data-mode="split"] #layout {
        padding-bottom: calc(var(--look-margin) * 0.55 + var(--look-label) * 2.5);
      }
      [data-mode="split"] .plot {
        height: 34vh;
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="card-back"></div>
      <div class="layout" id="layout">
        <div class="chart" id="chart">
          <h2 class="heading" id="label" data-var-text="label">Weekly users, millions</h2>
          <div class="plot" id="plot">
            <svg id="lines" viewBox="0 0 1000 1000" aria-hidden="true">
              <path id="line" d="M0 1000 L1000 0" />
            </svg>
          </div>
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
      <span class="tag" id="source" data-var-text="source">Source: company filings</span>
    </div>
    <script>
      const root = document.getElementById("root");
      const length = parseFloat(root.dataset.duration) || 5;
      const vars = window.__hyperframes?.getVariables?.() || {};
      document.querySelectorAll("[data-var-text]").forEach((el) => {
        const value = vars[el.dataset.varText];
        if (value != null) el.textContent = String(value);
      });
      const num = (id, fallback) => {
        const value = parseFloat(vars[id]);
        return Number.isFinite(value) ? value : fallback;
      };
      const text = (id, fallback = "") => String(vars[id] ?? fallback);
      // The video's look: durations, easing and travel for every tween.
      const style = getComputedStyle(root);
      const token = (name, fallback) => style.getPropertyValue(`--look-${name}`).trim() || fallback;
      const seconds = parseFloat(token("duration", "700")) / 1000;
      const out = parseFloat(token("out", "350")) / 1000;
      const stagger = parseFloat(token("stagger", "90")) / 1000;
      const rise = token("distance", "1.8vmin");
      gsap.defaults({ duration: seconds, ease: token("gsap-ease", "expo.out") });
      root.dataset.align = token("align", "center");
      // Text a long value would push out of its box gets smaller until it fits (see count-up).
      function fit(el, wide = false) {
        const unit = Math.min(innerWidth, innerHeight) / 100;
        let size = parseFloat(getComputedStyle(el).fontSize);
        const over = () =>
          el.scrollHeight - el.clientHeight > size * 0.5 ||
          (wide && el.scrollWidth > el.clientWidth + 1);
        for (let n = 0; n < 45 && over(); n++) {
          size *= 0.93;
          el.style.fontSize = `${size / unit}vmin`;
        }
        if (el.scrollHeight > el.clientHeight + 1) el.style.maxHeight = `${el.scrollHeight}px`;
      }
      // When the action happens: the cue, kept inside the clip.
      const cue = Math.min(Math.max(num("cue", 1), 0.3), Math.max(0.3, length - 1.2));
      const tl = gsap.timeline({ paused: true });
      const unit = text("unit", "m").trim();
      const before = unit && Array.from(unit).length <= 2 && /^[^0-9a-z%]+$/i.test(unit);
      const points = text("points", "Jan: 12|Feb: 15|Mar: 14|Apr: 22|May: 31|Jun: 18")
        .split("|")
        .map((p) => {
          const at = p.lastIndexOf(":");
          const name = (at < 0 ? p : p.slice(0, at)).trim();
          const shown = (at < 0 ? "" : p.slice(at + 1)).trim();
          const value = parseFloat(shown.replace(/[^0-9.\-]/g, ""));
          return { name, shown, value: Number.isFinite(value) ? value : 0 };
        })
        .filter((p) => p.name)
        .slice(0, 12);
      if (points.length === 1) points.unshift({ ...points[0], name: "" });
      const wanted = text("highlight", "May").trim().toLowerCase();
      let picked = points.findIndex((p) => wanted && p.name.toLowerCase() === wanted);
      if (picked < 0) picked = points.length - 1;
      // From zero (or the lowest value, when one is below it) to the highest, with headroom.
      const values = points.map((p) => p.value);
      const low = Math.min(0, ...values);
      const high = Math.max(...values, low + 1e-9);
      const xAt = (i) => (points.length > 1 ? (i / (points.length - 1)) * 100 : 50);
      // The top quarter is left for the value over the highest point.
      const yAt = (v) => 100 - ((v - low) / (high - low)) * 70;
      // In the plot's pixels, so the dash that draws it is as long as the line on screen.
      const plot = document.getElementById("plot");
      const w = plot.clientWidth || 1000;
      const h = plot.clientHeight || 400;
      document.getElementById("lines").setAttribute("viewBox", `0 0 ${w} ${h}`);
      const line = document.getElementById("line");
      const path = points.map((p, i) => `${i ? "L" : "M"}${(xAt(i) * w) / 100} ${(yAt(p.value) * h) / 100}`).join(" ");
      line.setAttribute("d", path);
      const ticks = document.getElementById("ticks");
      // Labels under the baseline, every one while they fit, else every other one.
      const every = points.length > 8 ? 2 : 1;
      points.forEach((p, i) => {
        if (i % every && i !== picked && i !== points.length - 1) return;
        const tick = document.createElement("span");
        tick.className = i === picked ? "tick on" : "tick";
        tick.style.left = `${xAt(i)}%`;
        tick.textContent = p.name;
        ticks.appendChild(tick);
      });
      const target = points[picked];
      const marker = document.createElement("div");
      marker.className = "marker";
      marker.style.left = `${xAt(picked)}%`;
      marker.style.top = `${yAt(target.value)}%`;
      const reading = document.createElement("div");
      reading.className = "reading";
      reading.id = "reading";
      // Over its point, kept inside the plot: from the point rightward near the left edge,
      // leftward near the right edge.
      const x = xAt(picked);
      reading.style.left = `${x}%`;
      const shift = x < 25 ? "0%" : x > 75 ? "-100%" : "-50%";
      reading.style.transform = `translate(${shift}, -100%)`;
      reading.style.textAlign = x < 25 ? "left" : x > 75 ? "right" : "center";
      reading.style.top = `${yAt(target.value)}%`;
      reading.textContent = target.shown ? (before ? `${unit}${target.shown}` : unit ? `${target.shown} ${unit}` : target.shown) : "";
      plot.append(marker, reading);
      fit(reading, true);
      fit(document.getElementById("label"));
      tl.from("#label", { y: rise, opacity: 0 }, 0.1);
      tl.from(["#plot", "#ticks"], { opacity: 0 }, 0.15);
      tl.from("#source", { opacity: 0 }, 0.3);
      // On the cue the line draws left to right; the point that matters lands as it is reached.
      const total = line.getTotalLength() || 1;
      const draw = Math.min(Math.max(seconds * 2, 1), Math.max(0.6, length - cue - 0.8));
      line.style.strokeDasharray = `${total}`;
      tl.fromTo(line, { strokeDashoffset: total }, { strokeDashoffset: 0, duration: draw, ease: "power1.inOut" }, cue);
      const reached = cue + draw * (points.length > 1 ? picked / (points.length - 1) : 1);
      tl.fromTo(marker, { scale: 0 }, { scale: 1, duration: 0.25, ease: "power3.out" }, reached);
      tl.fromTo(reading, { opacity: 0 }, { opacity: 1, duration: 0.3 }, reached);
      fit(document.getElementById("source"));
      // Full screen: cut in and out unless AeroEdits asks for an ease.
      if (root.dataset.entrance === "ease") {
        tl.from(["#card-back", "#layout"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);
        tl.to(["#card-back", "#layout"], { opacity: 0, duration: out, ease: "power1.in" }, Math.max(1.2, length - out));
      }
      // One paused timeline, exactly as long as the clip; HyperFrames seeks it.
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["graphic"] = tl;
    </script>
  </body>
</html>
