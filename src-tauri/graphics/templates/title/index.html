<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Above the title","default":"Part 2"},
    {"id":"title","type":"string","label":"Title","default":"Setting up the project"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"Install, configure, run"},
    {"id":"background","type":"color","label":"Background","default":"#0F172A"},
    {"id":"text","type":"color","label":"Text","default":"#F8FAFC"},
    {"id":"accent","type":"color","label":"Accent","default":"#FACC15"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Section title</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        color: var(--text, #f8fafc);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #card-back {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--background, #0f172a);
      }
      .glow {
        position: absolute;
        width: 90vmax;
        height: 90vmax;
        left: -30vmax;
        top: -40vmax;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent, #facc15) 0%, transparent 62%);
        opacity: 0.16;
      }
      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 9vw;
        gap: 2.2vmin;
      }
      .kicker {
        font-size: 3.4vmin;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent, #facc15);
      }
      .bar {
        width: 14vmin;
        height: 1.1vmin;
        border-radius: 1vmin;
        background: var(--accent, #facc15);
        transform-origin: left center;
      }
      h1 {
        margin: 0;
        font-size: 10vmin;
        line-height: 1.04;
        font-weight: 800;
        max-width: 82vw;
      }
      .subtitle {
        font-size: 4.2vmin;
        opacity: 0.72;
        max-width: 80vw;
      }
      /* A tall canvas (a short): bigger type, the card lower. */
      @media (orientation: portrait) {
        .card {
          padding: 0 8vw;
          gap: 3vw;
        }
        .kicker {
          font-size: 4.6vw;
        }
        .bar {
          width: 20vw;
          height: 1.4vw;
        }
        h1 {
          font-size: 13vw;
        }
        .subtitle {
          font-size: 5.6vw;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="graphic"
      data-no-timeline
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4"
    >
      <div id="card-back">
      <div class="glow" id="glow"></div>
      <div class="card">
        <div class="kicker" id="kicker" data-var-text="kicker">Part 2</div>
        <div class="bar" id="bar"></div>
        <h1 id="title" data-var-text="title">Setting up the project</h1>
        <div class="subtitle" id="subtitle" data-var-text="subtitle">Install, configure, run</div>
      </div>
      </div>
    </div>
    <script>
      // Motion with the Web Animations API: no library, works offline. Every animation is
      // finite and paused; HyperFrames seeks them. The length comes from the root, which
      // AeroEdits sets to the clip's length when it renders.
      const root = document.getElementById("root");
      const length = (parseFloat(root.dataset.duration) || 4) * 1000;
      const ease = "cubic-bezier(0.2, 0, 0, 1)";
      const outAt = Math.max(1200, length - 450);
      function play(id, frames, delay, duration) {
        const el = document.getElementById(id);
        el.animate(frames, { duration, delay, easing: ease, fill: "both", iterations: 1 }).pause();
      }
      const rise = [
        { transform: "translateY(4vmin)", opacity: 0 },
        { transform: "translateY(0)", opacity: 1 },
      ];
      play("glow", [{ opacity: 0, transform: "scale(0.8)" }, { opacity: 0.16, transform: "scale(1)" }], 0, 1200);
      play("kicker", rise, 100, 600);
      play("bar", [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], 250, 600);
      play("title", rise, 300, 700);
      play("subtitle", rise, 480, 700);
      // The card fills the frame, so it cuts in and out. Only when AeroEdits asks for an ease
      // (in a short's slot over the full-screen camera) does it fade in and out again.
      if (root.dataset.entrance === "ease") {
        document.getElementById("card-back").animate(
          [{ opacity: 0 }, { opacity: 1, offset: 300 / length }, { opacity: 1, offset: outAt / length }, { opacity: 0 }],
          { duration: length, fill: "both", iterations: 1 },
        ).pause();
      }
    </script>
  </body>
</html>
