[package]
name = "aeroedits"
version = "0.1.0"
description = "Automated video editor for Windows and macOS"
authors = ["AeroEdits contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "aeroedits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeroedits"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tokio = { version = "1.38", features = ["sync", "rt", "macros", "time"] }
libc = "0.2"
tempfile = "3.10"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
wgpu = "27.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "6.0"
jpeg-encoder = { version = "0.7", features = ["simd"] }
tauri = { version = "2.0.0", optional = true , features = [] }
rfd = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
parakeet-rs = { version = "0.3.8", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Audio output for playback on Windows (WASAPI). macOS uses the Swift bridge.
[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[build-dependencies]
tauri-build = { version = "2.0.0", optional = true , features = [] }

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
custom-protocol = ["tauri/custom-protocol"]
# Local NVIDIA Parakeet transcription through ONNX Runtime. `parakeet` alone runs on the CPU;
# the GPU variants add an execution provider and fall back to the CPU when it is unavailable.
parakeet = ["dep:parakeet-rs"]
parakeet-cuda = ["parakeet", "parakeet-rs/cuda"]
parakeet-directml = ["parakeet", "parakeet-rs/directml"]
parakeet-webgpu = ["parakeet", "parakeet-rs/webgpu"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Decode, compositing and JPEG/H.264 work is far too slow unoptimized, which made
# `cargo tauri dev` play back at a fraction of real time. Optimize dev builds too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
