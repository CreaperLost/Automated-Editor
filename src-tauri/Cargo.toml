[package]
name = "aeroedits"
version = "0.1.0"
description = "Automated video editor for Windows and macOS"
authors = ["AeroEdits contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "aeroedits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeroedits"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tokio = { version = "1.38", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-std", "io-util"] }
# The local MCP server that AI agents (Claude Code, Codex, ...) connect to.
rmcp = { version = "3.5", default-features = false, features = ["server"] }
schemars = "1.0"
base64 = "0.23"
tokio-util = "0.7"
# Adds AeroEdits to Codex's config.toml without disturbing the rest of it.
toml_edit = "0.22"
libc = "0.2"
tempfile = "3.10"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
wgpu = "27.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "6.0"
dunce = "1.0"
jpeg-encoder = { version = "0.7", features = ["simd"] }
tauri = { version = "2.0.0", optional = true , features = [] }
rfd = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
parakeet-rs = { version = "0.3.8", optional = true }
# parakeet-rs 0.3.8 asks for ort ^2.0.0-rc.13, which also matches rc.14, and rc.14 changed
# Session::builder. Cargo.lock is not committed, so pin ort here until parakeet-rs catches up.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false }
# The built-in model for fillers and retakes (Qwen3.5 4B), on the GPU through Vulkan. No
# OpenMP: it would need the MSVC OpenMP runtime next to the app.
llama-cpp-2 = { version = "=0.1.160", optional = true, default-features = false, features = ["common", "vulkan"] }
fontdue = "0.9"
# Reads an installed font's family and weight, to find a brand kit's font for captions.
ttf-parser = "0.25"
# Checks the graphics runtime's downloads and names graphic renders.
sha2 = "0.10"
# Compresses the edit history's saved states (already in the tree through png).
flate2 = "1.1"
# Names the fields of an agent's settings change that the settings do not have.
serde_ignored = "0.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Audio output for playback on Windows (WASAPI). macOS uses the Swift bridge.
[target.'cfg(windows)'.dependencies]
cpal = "0.15"
# The MCP pipe: only this Windows account may open it. FileSystem: exports to drives without
# hard links (exFAT) publish with a move that never replaces.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[build-dependencies]
tauri-build = { version = "2.0.0", optional = true , features = [] }

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
custom-protocol = ["tauri/custom-protocol"]
# Local NVIDIA Parakeet transcription through ONNX Runtime. `parakeet` alone runs on the CPU;
# the GPU variants add an execution provider and fall back to the CPU when it is unavailable.
parakeet = ["dep:parakeet-rs", "dep:ort"]
parakeet-cuda = ["parakeet", "parakeet-rs/cuda"]
parakeet-directml = ["parakeet", "parakeet-rs/directml"]
parakeet-webgpu = ["parakeet", "parakeet-rs/webgpu"]
# The built-in local model for the filler and retake review (llama.cpp on Vulkan). Building it
# needs CMake, the Vulkan SDK (VULKAN_SDK) and libclang (LIBCLANG_PATH).
local-llm = ["dep:llama-cpp-2"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Decode, compositing and JPEG/H.264 work is far too slow unoptimized, which made
# `cargo tauri dev` play back at a fraction of real time. Optimize dev builds too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
